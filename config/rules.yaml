      - {name: "mail", args: [4]}
      - {name: "mb_send_mail", args: [4]}
    node_types:
      - "shell_command_expression"
    sanitizers:
      - "escapeshellarg"
      - "escapeshellcmd"
    remediation: "Avoid passing user input to OS commands. Use escapeshellarg() on every argument if unavoidable, and prefer proc_open with an argument array."

  code_injection:
    cwe: "CWE-94"
    owasp: "A03:2021 - Injection"
    severity: "critical"
    description: "User-controlled data executed as PHP code or used to select a callable"
    sinks:
      - "eval"
      - {name: "assert", args: [0]}
      - {name: "preg_replace", args: [0], confidence: medium}
      - "create_function"
      - {name: "call_user_func", args: [0]}
      - {name: "call_user_func_array", args: [0]}
      - {name: "forward_static_call", args: [0]}
      - {name: "forward_static_call_array", args: [0]}
      - {name: "array_map", args: [0]}
      - {name: "array_filter", args: [1]}
      - {name: "array_walk", args: [1]}
      - {name: "array_walk_recursive", args: [1]}
      - {name: "array_reduce", args: [1]}
      - {name: "usort", args: [1]}
      - {name: "uasort", args: [1]}
      - {name: "uksort", args: [1]}
      - {name: "preg_replace_callback", args: [1]}
      - {name: "register_shutdown_function", args: [0]}
      - {name: "register_tick_function", args: [0]}
      - {name: "set_error_handler", args: [0]}
      - {name: "set_exception_handler", args: [0]}
      - {name: "spl_autoload_register", args: [0]}
      - {name: "ob_start", args: [0]}
      - {name: "iterator_apply", args: [1]}
      - {name: "add_action", args: [1]}
      - {name: "add_filter", args: [1]}
      - {name: "add_shortcode", args: [1]}
      - {name: "do_shortcode", args: [0], confidence: medium}
      - {name: "new ReflectionFunction", args: [0]}
      - {name: "new ReflectionMethod", args: [0, 1]}
      - {name: "new ReflectionClass", args: [0], confidence: medium}
      - {name: "class_alias", args: [0]}
    sanitizers: []
    remediation: "Never pass user input to eval()/assert()/callables. Map user choices to a fixed whitelist of callbacks."

  file_inclusion:
    cwe: "CWE-98"
    owasp: "A03:2021 - Injection"
    severity: "critical"
    description: "User-controlled data determines included file path (LFI/RFI)"
