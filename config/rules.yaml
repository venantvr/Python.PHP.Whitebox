# --- Filtres contextuels (neutralisent des categories specifiques) ---
# "all" = toutes les categories de taint (valeur numerique, slug, cle...).
filters:
  # HTML / sortie
  htmlspecialchars:
    neutralizes: ["xss"]
  htmlentities:
    neutralizes: ["xss"]
  strip_tags:
    neutralizes: ["xss"]
    confidence: "medium"
  urlencode:
    neutralizes: ["xss", "open_redirect", "rce", "ldap_injection", "xpath_injection", "sql_injection"]
  rawurlencode:
    neutralizes: ["xss", "open_redirect", "rce", "ldap_injection", "xpath_injection", "sql_injection"]
  json_encode:
    neutralizes: ["xss"]
    confidence: "medium"
  wp_json_encode:
    neutralizes: ["xss"]
    confidence: "medium"
  e:                                  # Laravel helper e()
    neutralizes: ["xss"]
  # SQL
  mysqli_real_escape_string:
    neutralizes: ["sql_injection"]
    arg: 1
  mysqli_escape_string:
    neutralizes: ["sql_injection"]
    arg: 1
  "mysqli::real_escape_string":
    neutralizes: ["sql_injection"]
  "mysqli::escape_string":
    neutralizes: ["sql_injection"]
  mysql_real_escape_string:
    neutralizes: ["sql_injection"]
    confidence: "medium"
  mysql_escape_string:
    neutralizes: ["sql_injection"]
    confidence: "low"
  pg_escape_string:
    neutralizes: ["sql_injection"]
    arg: -1                           # dernier argument (pg_escape_string([$conn,] $s))
  pg_escape_literal:
    neutralizes: ["sql_injection"]
    arg: -1
  pg_escape_identifier:
    neutralizes: ["sql_injection"]
    arg: -1
  pg_escape_bytea:
    neutralizes: ["sql_injection"]
    arg: -1
  sqlite_escape_string:
    neutralizes: ["sql_injection"]
  "SQLite3::escapeString":
    neutralizes: ["sql_injection"]
  db2_escape_string:
    neutralizes: ["sql_injection"]
  "->quote":
    neutralizes: ["sql_injection"]
  "->escape":
    neutralizes: ["sql_injection"]
  "->escape_str":
    neutralizes: ["sql_injection"]
  "->escape_like_str":
    neutralizes: ["sql_injection"]
  "->escapeString":
    neutralizes: ["sql_injection"]
  addslashes:
    neutralizes: ["sql_injection"]
    confidence: "low"
  esc_sql:
    neutralizes: ["sql_injection"]
  "wpdb::prepare":
    neutralizes: ["sql_injection"]
    arg: 1
    variadic: true
  "wpdb::_real_escape":
    neutralizes: ["sql_injection"]
  "wpdb::_escape":
    neutralizes: ["sql_injection"]
  sanitize_sql_orderby:
    neutralizes: ["sql_injection"]
  # Shell
  escapeshellarg:
    neutralizes: ["rce"]
  escapeshellcmd:
    neutralizes: ["rce"]
    confidence: "medium"
  # Numeriques : une valeur numerique est inoffensive dans TOUS les contextes
  intval:
    neutralizes: all
  floatval:
    neutralizes: all
  doubleval:
    neutralizes: all
  absint:
    neutralizes: all
  abs:
    neutralizes: all
  round:
    neutralizes: all
  floor:
    neutralizes: all
  ceil:
    neutralizes: all
  number_format:
    neutralizes: all
  boolval:
    neutralizes: all
  wp_parse_id_list:
    neutralizes: all
  _cast_int:
    neutralizes: all
  _cast_integer:
    neutralizes: all
  _cast_float:
    neutralizes: all
  _cast_double:
    neutralizes: all
  _cast_bool:
    neutralizes: all
  _cast_boolean:
    neutralizes: all
  # Chemins
  basename:
    neutralizes: ["path_traversal", "file_inclusion"]
  realpath:
    neutralizes: ["path_traversal"]
    confidence: "medium"
  sanitize_file_name:
    neutralizes: ["path_traversal", "file_inclusion", "xss"]
  # LDAP / XPath
  ldap_escape:
    neutralizes: ["ldap_injection"]
  # filter_var / filter_input : neutralisation selon le flag (voir filter_flags)
  filter_var:
    neutralizes: []
    flags_arg: 1
  filter_input:
    neutralizes: []
    flags_arg: 2
  # WordPress - sortie HTML
  esc_html:
    neutralizes: ["xss"]
  esc_attr:
    neutralizes: ["xss"]
  esc_textarea:
    neutralizes: ["xss"]
  esc_js:
    neutralizes: ["xss"]
  esc_html_x:
    neutralizes: ["xss"]
  esc_attr__:
    neutralizes: ["xss"]
  esc_attr_x:
    neutralizes: ["xss"]
  esc_html_e:
    neutralizes: ["xss"]
  esc_attr_e:
    neutralizes: ["xss"]
  esc_url:
    neutralizes: ["xss"]
  esc_url_raw:
    neutralizes: ["xss"]
    confidence: "medium"
  wp_kses:
    neutralizes: ["xss"]
  wp_kses_post:
    neutralizes: ["xss"]
  wp_kses_data:
    neutralizes: ["xss"]
  wp_filter_kses:
    neutralizes: ["xss"]
  wp_filter_post_kses:
    neutralizes: ["xss"]
  wp_filter_nohtml_kses:
    neutralizes: ["xss"]
  wp_strip_all_tags:
    neutralizes: ["xss"]
    confidence: "medium"
  wp_specialchars:
    neutralizes: ["xss"]
  sanitize_text_field:
    neutralizes: ["xss"]
  sanitize_textarea_field:
    neutralizes: ["xss"]
  sanitize_email:
    neutralizes: ["xss", "rce", "path_traversal", "file_inclusion", "code_injection", "open_redirect", "ssrf", "ldap_injection", "xpath_injection"]
  sanitize_user:
    neutralizes: ["xss", "rce", "path_traversal", "file_inclusion", "code_injection", "open_redirect", "ssrf"]
  sanitize_key:
    neutralizes: all
  sanitize_title:
    neutralizes: all
  sanitize_title_with_dashes:
    neutralizes: all
  sanitize_html_class:
    neutralizes: all
  sanitize_hex_color:
    neutralizes: all
  sanitize_hex_color_no_hash:
    neutralizes: all
  sanitize_mime_type:
    neutralizes: all
  # Laravel / Symfony
  "Str::slug":
    neutralizes: all
  "->slug":
    neutralizes: all
  twig_escape_filter:
    neutralizes: ["xss"]
  "->escapeHtml":
    neutralizes: ["xss"]
  "->escapeHtmlAttr":
    neutralizes: ["xss"]
  "->escapeJs":
    neutralizes: ["xss"]
  "->escapeUrl":
    neutralizes: ["xss", "open_redirect"]

# Flags FILTER_* : categories neutralisees quand ce flag est passe a filter_var / filter_input.
filter_flags:
  FILTER_VALIDATE_INT: all
  FILTER_VALIDATE_FLOAT: all
  FILTER_VALIDATE_BOOL: all
  FILTER_VALIDATE_BOOLEAN: all
  FILTER_VALIDATE_IP: all
  FILTER_VALIDATE_MAC: all
  FILTER_VALIDATE_DOMAIN: all
  FILTER_VALIDATE_EMAIL: ["xss", "rce", "path_traversal", "file_inclusion", "code_injection", "open_redirect", "ssrf", "ldap_injection", "xpath_injection"]
  FILTER_VALIDATE_URL: []            # javascript: et hotes internes passent la validation
  FILTER_VALIDATE_REGEXP: []
  FILTER_SANITIZE_NUMBER_INT: all
  FILTER_SANITIZE_NUMBER_FLOAT: all
  FILTER_SANITIZE_SPECIAL_CHARS: ["xss"]
  FILTER_SANITIZE_FULL_SPECIAL_CHARS: ["xss"]
  FILTER_SANITIZE_STRING: ["xss"]
  FILTER_SANITIZE_STRIPPED: ["xss"]
  FILTER_SANITIZE_ENCODED: ["xss", "open_redirect"]
  FILTER_SANITIZE_EMAIL: ["xss", "rce", "path_traversal", "file_inclusion", "code_injection", "open_redirect", "ssrf"]
  FILTER_SANITIZE_URL: []
  FILTER_SANITIZE_ADD_SLASHES: ["sql_injection"]
  FILTER_SANITIZE_MAGIC_QUOTES: ["sql_injection"]
  FILTER_DEFAULT: []
  FILTER_UNSAFE_RAW: []

# --- Validateurs : gardes booleennes dans les conditions ---
# if (is_numeric($x)) {...}      -> $x neutralise dans la branche then
# if (!in_array($x, $ok)) die(); -> $x neutralise apres le if (branche then terminale)
validators:
  is_numeric: {neutralizes: all}
  is_int: {neutralizes: all}
  is_integer: {neutralizes: all}
  is_long: {neutralizes: all}
  is_float: {neutralizes: all}
  is_double: {neutralizes: all}
  is_bool: {neutralizes: all}
  ctype_digit: {neutralizes: all}
  ctype_alnum: {neutralizes: all}
  ctype_alpha: {neutralizes: all}
  ctype_xdigit: {neutralizes: all}
  ctype_upper: {neutralizes: all}
  ctype_lower: {neutralizes: all}
  in_array: {neutralizes: all, arg: 0}
  array_key_exists: {neutralizes: all, arg: 0}
  key_exists: {neutralizes: all, arg: 0}
  preg_match: {neutralizes: all, arg: 1, regex_arg: 0, confidence: medium}
  mb_ereg: {neutralizes: all, arg: 1, regex_arg: 0, confidence: medium}
  is_email: {neutralizes: ["xss", "rce", "path_traversal", "file_inclusion", "code_injection", "open_redirect", "ssrf", "ldap_injection", "xpath_injection"]}
  wp_http_validate_url: {neutralizes: ["xss", "rce", "path_traversal", "file_inclusion", "code_injection"]}
  checkdate: {neutralizes: all}

# Fonctions ecrivant dans un argument par reference (sortie heritant du taint de l'entree)
ref_outputs:
  preg_match: {from: 1, to: 2, regex_arg: 0}
  preg_match_all: {from: 1, to: 2, regex_arg: 0}
  parse_str: {from: 0, to: 1}
  mb_parse_str: {from: 0, to: 1}
  wp_parse_str: {from: 0, to: 1}
  sscanf: {from: 0, to: 2}
  str_replace: {from: 2, to: 3}

# Gardes de privilege : un sink dans un bloc garde par ces fonctions est note
# "privileged" (severite reduite d'un cran : contexte admin uniquement).
privilege_guards:
  - "current_user_can"
  - "is_super_admin"
  - "is_admin"
  - "check_admin_referer"
  - "check_ajax_referer"
  - "wp_verify_nonce"
  - "user_can"
  - "is_user_logged_in"

# Fonctions terminales (le flux ne continue pas apres l'appel)
terminators:
  - "exit"
  - "die"
  - "wp_die"
  - "wp_send_json"
  - "wp_send_json_error"
  - "wp_send_json_success"
  - "wp_safe_redirect_and_exit"
  - "abort"
  - "trigger_error"

heuristics:
  # Fonctions inconnues dont le nom suggere un nettoyage : considerees comme
  # neutralisant tout (confiance basse). Mettre une regex vide pour desactiver.
  assume_sanitizer_pattern: "(?i)(sanitiz|escap|clean|purif|validat|whitelist|allowlist|safe_)"
  # Indices qu'un argument de sink file_get_contents/fopen est une URL (-> ssrf) et non un chemin.
  url_hint_pattern: "(?i)(url|uri|href|link|endpoint|host|remote|http|api|feed|webhook|domain)"

# --- Vulnerabilites (sinks + metadata) ---
# L'ordre de declaration sert a departager les sinks ambigus ("->query" : SQL avant XPath).
vulnerabilities:
  sql_injection:
    cwe: "CWE-89"
    owasp: "A03:2021 - Injection"
    severity: "critical"
    description: "User-controlled data reaches a SQL query without parameterization"
    sinks:
