  xss:
    cwe: "CWE-79"
    owasp: "A03:2021 - Injection"
    severity: "high"
    description: "User-controlled data rendered in HTML output without encoding"
    sinks:
      - "echo"
      - "print"
      - "printf"
      - "vprintf"
      - "die"
      - "exit"
      - {name: "print_r", args: [0], max_args: 1}
      - {name: "var_dump", args: [0], confidence: medium}
      - {name: "var_export", args: [0], max_args: 1}
      - "_e"
      - "_ex"
      - "wp_die"
      - {name: "wp_add_inline_script", args: [1]}
      - {name: "wp_add_inline_style", args: [1]}
      - {name: "response", args: [0]}
      - "Response::make"
      - "new Response"
      - "->setContent"
      - "->html"
      - "->write"
    node_types:
      - "echo_statement"
      - "print_intrinsic"
      - "exit_statement"
    sanitizers:
      - "htmlspecialchars"
      - "htmlentities"
      - "strip_tags"
      - "urlencode"
      - "esc_html"
      - "esc_attr"
      - "wp_kses_post"
    remediation: "Escape at output: htmlspecialchars($x, ENT_QUOTES, 'UTF-8') / esc_html() / esc_attr() / esc_url() depending on the HTML context."

  rce:
    cwe: "CWE-78"
    owasp: "A03:2021 - Injection"
    severity: "critical"
    description: "User-controlled data reaches OS command execution"
    sinks:
