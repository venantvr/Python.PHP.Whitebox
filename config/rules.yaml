# config/rules.yaml - Regles de detection Python.PHP.Whitebox
#
# Couvre le PHP generique + WordPress ($wpdb, esc_*, sanitize_*, wp_remote_*, ...)
# + les frameworks courants (Laravel, Symfony, CodeIgniter, PSR-7).
# Les noms de fonctions etant uniques, toutes les regles sont actives en meme
# temps : un projet non-WordPress n'est pas penalise par les regles WordPress.
#
# Syntaxe des sinks :
#   - "func"                        fonction globale
#   - "->method"                    methode sur n'importe quel objet
#   - "Class::method"               methode sur un objet dont la classe est connue
#                                   ($x = new Class, $this, ou nom de variable
#                                   evocateur : $wpdb, $pdo, $xpath ...)
#   - "Class::staticMethod"         s'applique aussi aux appels statiques
#   - "new Class"                   constructeur
#   - {name: "...", args: [0], max_args: 1, when_arg: [1, "REGEX"],
#      safe_if_arg: [1, "REGEX"], confidence: medium}
#
# Syntaxe des filtres :
#   name: {neutralizes: [cat, ...] | all, confidence: high|medium|low,
#          arg: 0, variadic: false, flags_arg: null}

version: "3.0"

# --- Sources de taint (entrees utilisateur) ---
sources:
  superglobals:
    - "$_GET"
    - "$_POST"
    - "$_COOKIE"
    - "$_REQUEST"
    - "$_SERVER"
    - "$_FILES"
    - "$_ENV"
    - "$argv"
    - "$HTTP_RAW_POST_DATA"

  # $_SERVER : seules ces cles (et toutes les HTTP_*) sont controlees par le client.
  # Les autres ($_SERVER['DOCUMENT_ROOT'], 'SCRIPT_NAME'...) ne sont pas tainted.
  dangerous_server_keys:
    - "HTTP_HOST"
    - "HTTP_REFERER"
    - "HTTP_USER_AGENT"
    - "HTTP_X_FORWARDED_FOR"
    - "HTTP_X_FORWARDED_HOST"
    - "HTTP_ACCEPT"
    - "HTTP_ACCEPT_LANGUAGE"
    - "HTTP_COOKIE"
    - "HTTP_AUTHORIZATION"
    - "REQUEST_URI"
    - "QUERY_STRING"
    - "PATH_INFO"
    - "ORIG_PATH_INFO"
    - "PATH_TRANSLATED"
    - "PHP_SELF"
    - "REQUEST_METHOD"
    - "CONTENT_TYPE"
    - "PHP_AUTH_USER"
    - "PHP_AUTH_PW"
    - "REMOTE_ADDR"
    - "SERVER_NAME"

  # Fonctions retournant des donnees utilisateur.
  # when_arg: [index, regex] -> source uniquement si l'argument matche.
  functions:
    - "getallheaders"
    - "apache_request_headers"
    - "getenv"
    - "readline"
    - "filter_input"                 # flags geres via filter_flags
    - "filter_input_array"
    - {name: "file_get_contents", when_arg: [0, "php://(input|stdin)"]}
    - {name: "fopen", when_arg: [0, "php://(input|stdin)"]}
    - {name: "fgets", when_arg: [0, "STDIN"]}
    - {name: "fread", when_arg: [0, "STDIN"]}
    - {name: "stream_get_contents", when_arg: [0, "STDIN"]}
    # WordPress
    - "get_query_var"
    - "wp_get_raw_referer"
    - "wp_get_referer"
    # Laravel / helpers globaux
    - "request"
    - "old"

  # Objets "requete" des frameworks : tout acces (methode ou propriete) est une source.
  # object_pattern est testee sur le texte de l'objet ($request, $this->request, request(),
  # Request::, $request->query ...). request_types : types de parametres (function f(Request $r)).
  request_objects:
    object_pattern: '^(\\?(Illuminate\\Http\\|Symfony\\Component\\HttpFoundation\\)?Request|Input|\$request|\$req|\$input|\$this->request|\$this->input|request\(\)|\$psrRequest|\$serverRequest)(->(query|request|cookies|headers|files|server|attributes|post|get))?$'
    request_types:
      - "Request"
      - "ServerRequestInterface"
      - "RequestInterface"
      - "HttpRequest"
      - "IncomingRequest"
      - "ServerRequest"
      - "WP_REST_Request"
    methods:
      - "get"
      - "input"
      - "post"
      - "query"
      - "all"
      - "cookie"
      - "header"
      - "headers"
      - "file"
      - "files"
      - "route"
      - "only"
      - "except"
      - "json"
      - "getContent"
      - "getParam"
      - "getParams"
      - "getQueryParams"
      - "getParsedBody"
      - "getUploadedFiles"
      - "getCookieParams"
      - "getServerParams"
      - "getHeader"
      - "getHeaderLine"
      - "getBody"
      - "getUri"
      - "getRequestUri"
      - "getPathInfo"
      - "getVar"
      - "getPost"
      - "getGet"
      - "getRawInput"
      - "getJSON"
      - "getJsonParams"
      - "getBodyParams"
      - "getQueryParam"
      - "getUserAgent"
      - "param"
      - "params"
      - "validate"
      - "validated"
      - "string"
      - "integer"
      - "boolean"
      - "date"
    properties: true

  # Methodes non ambigues (PSR-7, WP_REST_Request) reconnues sur n'importe quel objet.
  methods:
    - "getParsedBody"
    - "getQueryParams"
    - "getUploadedFiles"
    - "getCookieParams"
    - "get_json_params"
    - "get_body_params"
    - "get_query_params"
    - "get_url_params"
    - "get_params"
    - "get_param"
    - "get_body"
    - "get_file_params"
    - "get_header"

