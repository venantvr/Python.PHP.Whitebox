    remediation: "Use basename() and validate with realpath() against an allowed base directory; reject '..' sequences."

  insecure_upload:
    cwe: "CWE-434"
    owasp: "A04:2021 - Insecure Design"
    severity: "high"
    description: "Uploaded file stored under a user-controlled name without validation of its extension/type"
    sinks:
      - {name: "move_uploaded_file", args: [1]}
      - {name: "wp_upload_bits", args: [0]}
    sanitizers: []
    remediation: "Validate extension and MIME type against a whitelist, generate a random server-side filename, store outside the webroot."

  insecure_deserialization:
    cwe: "CWE-502"
    owasp: "A08:2021 - Software and Data Integrity Failures"
    severity: "critical"
    description: "User-controlled data passed to unserialize()"
    sinks:
      - {name: "unserialize", args: [0], safe_if_arg: [1, "allowed_classes[\"']?\\s*=>\\s*false"]}
      - "maybe_unserialize"
      - "yaml_parse"
      - "igbinary_unserialize"
      - "msgpack_unpack"
    sanitizers: []
    remediation: "Use json_decode() instead. If unserialize() is required, pass ['allowed_classes' => false]."

  ssrf:
    cwe: "CWE-918"
    owasp: "A10:2021 - SSRF"
    severity: "high"
    description: "User-controlled data determines target of server-side HTTP requests"
    sinks:
      - {name: "curl_init", args: [0]}
      - {name: "curl_setopt", args: [2], when_arg: [1, "CURLOPT_URL"]}
      - {name: "curl_setopt_array", args: [1], confidence: medium}
      - {name: "file_get_contents", args: [0]}
      - {name: "fopen", args: [0]}
      - {name: "readfile", args: [0]}
      - {name: "file", args: [0]}
      - {name: "copy", args: [0, 1]}
      - {name: "get_headers", args: [0]}
      - {name: "fsockopen", args: [0]}
      - {name: "pfsockopen", args: [0]}
      - {name: "stream_socket_client", args: [0]}
      - {name: "simplexml_load_file", args: [0]}
      - {name: "DOMDocument::load", args: [0]}
      - {name: "new SoapClient", args: [0]}
      - {name: "wp_remote_get", args: [0]}
      - {name: "wp_remote_post", args: [0]}
      - {name: "wp_remote_head", args: [0]}
      - {name: "wp_remote_request", args: [0]}
      - {name: "wp_remote_fopen", args: [0]}
      - {name: "download_url", args: [0]}
      - {name: "wp_oembed_get", args: [0]}
      - {name: "Http::get", args: [0]}
      - {name: "Http::post", args: [0]}
      - {name: "Http::put", args: [0]}
      - {name: "Http::patch", args: [0]}
      - {name: "Http::delete", args: [0]}
      - {name: "Http::head", args: [0]}
      - {name: "->request", args: [1], confidence: medium}
      - {name: "->getAsync", args: [0]}
      - {name: "->postAsync", args: [0]}
    sanitizers:
      - "filter_var"
    remediation: "Validate and whitelist target hosts; resolve DNS and block private/loopback IP ranges before requesting. Prefer wp_safe_remote_get()."

  xxe:
    cwe: "CWE-611"
    owasp: "A05:2021 - Security Misconfiguration"
    severity: "high"
    description: "XML parsing of user-controlled data (external entities may be resolved if LIBXML_NOENT / entity loading is enabled)"
    sinks:
      - "simplexml_load_string"
      - "simplexml_load_file"
      - "DOMDocument::loadXML"
      - "DOMDocument::load"
      - "XMLReader::open"
      - "XMLReader::xml"
      - "xml_parse"
      - "xml_parse_into_struct"
      - "new SimpleXMLElement"
      - "new SimpleXMLIterator"
      - "->loadXML"
    sanitizers: []
    remediation: "Never pass LIBXML_NOENT/LIBXML_DTDLOAD; on PHP < 8 call libxml_disable_entity_loader(true). Use LIBXML_NONET."

  xpath_injection:
    cwe: "CWE-643"
    owasp: "A03:2021 - Injection"
    severity: "high"
    description: "User-controlled data used in an XPath expression"
    sinks:
      - "DOMXPath::query"
      - "DOMXPath::evaluate"
      - "->xpath"
      - "SimpleXMLElement::xpath"
    sanitizers: []
    remediation: "Escape quotes in XPath literals or validate against a strict whitelist; prefer parameterized XPath (e.g. variables via DOMXPath::registerPhpFunctions alternatives)."

  open_redirect:
    cwe: "CWE-601"
    owasp: "A01:2021 - Broken Access Control"
    severity: "medium"
    description: "User-controlled data in HTTP redirect location"
    sinks:
      - "header"
      - "wp_redirect"
      - "http_redirect"
      - {name: "redirect", args: [0]}
      - "Redirect::to"
      - "Redirect::away"
      - "new RedirectResponse"
      - "->redirect"
      - "->redirectTo"
      - "->setRedirect"
      - "->away"
    sanitizers:
      - "filter_var"
      - "urlencode"
    remediation: "Validate redirect URL against a whitelist of local paths/trusted domains. In WordPress use wp_safe_redirect() + wp_validate_redirect()."

  ldap_injection:
    cwe: "CWE-90"
    owasp: "A03:2021 - Injection"
    severity: "high"
    description: "User-controlled data in LDAP queries without escaping"
    sinks:
      - "ldap_search"
      - "ldap_bind"
      - "ldap_list"
      - "ldap_read"
      - "ldap_compare"
      - "ldap_delete"
      - "ldap_mod_add"
      - "ldap_mod_replace"
      - "ldap_mod_del"
      - "ldap_modify"
      - "ldap_add"
      - "ldap_rename"
    sanitizers:
      - "ldap_escape"
    remediation: "Use ldap_escape() (LDAP_ESCAPE_FILTER / LDAP_ESCAPE_DN) on all user input in LDAP filters and DNs."

  session_fixation:
    cwe: "CWE-384"
    owasp: "A07:2021 - Identification and Authentication Failures"
    severity: "medium"
    description: "Session ID set from user-controlled input"
    sinks:
      - {name: "session_id", args: [0]}
    sanitizers: []
    remediation: "Never set session_id() from user input. Call session_regenerate_id(true) after authentication."

  variable_overwrite:
    cwe: "CWE-621"
    owasp: "A04:2021 - Insecure Design"
    severity: "medium"
    description: "User-controlled data turned into local variables (extract/parse_str) may overwrite existing variables"
    sinks:
      - {name: "extract", args: [0], safe_if_arg: [1, "EXTR_SKIP|EXTR_PREFIX"]}
      - {name: "parse_str", args: [0], max_args: 1}
      - {name: "mb_parse_str", args: [0], max_args: 1}
    sanitizers: []
    remediation: "Avoid extract() on request data (or use EXTR_SKIP / EXTR_PREFIX_ALL). Always pass the second argument to parse_str()."

  email_injection:
    cwe: "CWE-93"
    owasp: "A03:2021 - Injection"
    severity: "medium"
    description: "User-controlled data in e-mail headers (CRLF injection, header spoofing)"
    sinks:
      - {name: "mail", args: [3], confidence: medium}
      - {name: "mb_send_mail", args: [3], confidence: medium}
      - {name: "wp_mail", args: [3], confidence: medium}
      - {name: "->addCustomHeader", args: [0, 1]}
    sanitizers: []
    remediation: "Never build mail headers from user input; validate addresses with filter_var(FILTER_VALIDATE_EMAIL) and strip CR/LF."

  crypto_weakness:
    cwe: "CWE-327"
    owasp: "A02:2021 - Cryptographic Failures"
    severity: "medium"
    detection_mode: "pattern"
    description: "Use of weak cryptographic algorithms or insecure randomness"
    sinks: []
    patterns:
      - pattern: "\\b(md5|sha1)\\s*\\(\\s*[^)]*(pass|pwd|secret|token|salt|auth|credential)"
        message: "MD5/SHA1 used to hash credentials (weak, no salt/stretching)"
        severity: "medium"
      - pattern: "\\b(md5|sha1)\\s*\\("
        message: "MD5/SHA1 hash used (weak for any security purpose)"
        severity: "low"
      - pattern: "\\bhash\\s*\\(\\s*['\"](md5|sha1|md4|md2|crc32b?|adler32)['\"]"
        message: "Weak hash algorithm passed to hash()"
        severity: "low"
      - pattern: "\\b(rand|mt_rand|uniqid|lcg_value|mt_srand|srand|array_rand|shuffle|str_shuffle)\\s*\\([^;]*;.*(token|nonce|otp|salt|key|secret|csrf|password|session|reset|activation)"
        message: "Non-cryptographic random generator used for a security token"
        severity: "medium"
      - pattern: "\\b(rand|mt_rand|uniqid|lcg_value|str_shuffle)\\s*\\("
        message: "rand()/mt_rand()/uniqid() are not cryptographically secure"
        severity: "low"
      - pattern: "\\bmcrypt_\\w+\\s*\\("
        message: "mcrypt extension is deprecated/removed; use openssl_* or sodium_*"
        severity: "medium"
      - pattern: "\\bopenssl_encrypt\\s*\\([^,]+,\\s*['\"](des|des-ede|des-ede3|rc2|rc4|bf|blowfish|aes-\\d+-ecb|des-ecb)[\\w-]*['\"]"
        message: "Weak cipher or ECB mode in openssl_encrypt()"
        severity: "medium"
      - pattern: "\\bcrypt\\s*\\([^,)]+\\)"
        message: "crypt() called without a salt (weak DES-based hashing)"
        severity: "medium"
      - pattern: "CURLOPT_SSL_VERIFY(PEER|HOST)\\s*,\\s*(false|0|FALSE)"
        message: "TLS certificate verification disabled (CURLOPT_SSL_VERIFYPEER/HOST = false)"
        severity: "high"
      - pattern: "['\"]verify_peer['\"]\\s*=>\\s*false|['\"]sslverify['\"]\\s*=>\\s*false"
        message: "TLS certificate verification disabled in stream/HTTP options"
        severity: "high"
    sanitizers: []
    remediation: "Use password_hash()/password_verify() for passwords, random_bytes()/random_int() for tokens, sodium_* or AES-GCM for encryption."

  hardcoded_secrets:
    cwe: "CWE-798"
    owasp: "A07:2021 - Identification and Authentication Failures"
    severity: "high"
    detection_mode: "pattern"
    description: "Credentials or keys hardcoded in source code"
    sinks: []
    patterns:
      - pattern: "(?i)\\$?\\b(password|passwd|pwd|db_pass|dbpass|db_password|mysql_pass)\\s*=\\s*['\"](?P<value>[^'\"]{4,})['\"]"
        message: "Hardcoded password detected"
      - pattern: "(?i)['\"](password|passwd|pwd|db_pass|db_password)['\"]\\s*=>\\s*['\"](?P<value>[^'\"]{4,})['\"]"
        message: "Hardcoded password in array/config"
      - pattern: "(?i)define\\s*\\(\\s*['\"](DB_PASSWORD|[A-Z0-9_]*(PASSWORD|PASSWD|SECRET|API_KEY|APIKEY|PRIVATE_KEY|ACCESS_TOKEN|AUTH_KEY|SALT))['\"]\\s*,\\s*['\"](?P<value>[^'\"]{4,})['\"]"
        message: "Hardcoded credential in define()"
      - pattern: "(?i)\\b(api_key|apikey|api_secret|secret_key|client_secret|consumer_secret|private_key|encryption_key|app_key)\\s*(=|=>|:)\\s*['\"](?P<value>[^'\"]{8,})['\"]"
        message: "Hardcoded API key / secret detected"
      - pattern: "(?i)\\b(token|access_token|auth_token|bearer_token|refresh_token|secret_token)\\s*(=|=>|:)\\s*['\"](?P<value>[^'\"]{8,})['\"]"
        message: "Hardcoded token detected"
      - pattern: "(?i)(aws_access_key_id|aws_secret_access_key)\\s*(=|=>)\\s*['\"](?P<value>[^'\"]+)['\"]"
        message: "Hardcoded AWS credential detected"
      - pattern: "\\b(?P<value>AKIA[0-9A-Z]{16})\\b"
        message: "AWS Access Key ID detected"
      - pattern: "(?i)(mysql|pgsql|postgres|mongodb|redis|amqp)://[^:/\\s'\"]+:(?P<value>[^@\\s'\"]+)@"
        message: "Hardcoded database connection string with password"
      - pattern: "-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----"
        message: "Private key in source code"
      - pattern: "\\b(?P<value>sk_live_[0-9a-zA-Z]{16,})\\b"
        message: "Stripe live secret key detected"
      - pattern: "\\b(?P<value>gh[pousr]_[A-Za-z0-9]{30,})\\b"
        message: "GitHub token detected"
      - pattern: "\\b(?P<value>xox[baprs]-[0-9A-Za-z-]{10,})\\b"
        message: "Slack token detected"
      - pattern: "\\b(?P<value>eyJ[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{10,})\\b"
        message: "Hardcoded JWT detected"
        severity: "medium"
    sanitizers: []
    remediation: "Store secrets in environment variables or a secrets manager (never in version control)."

  type_juggling:
    cwe: "CWE-697"
    owasp: "A07:2021 - Identification and Authentication Failures"
    severity: "medium"
    detection_mode: "pattern"
    description: "Loose comparison (==) in security-sensitive context"
    sinks: []
    patterns:
      - pattern: "==\\s*['\"]0e\\d+"
        message: "Magic hash comparison vulnerable to type juggling"
      - pattern: "\\b(md5|sha1|hash|crc32|hash_hmac)\\s*\\([^;]*\\)\\s*(==|!=)\\s*[^=]"
        message: "Hash compared with loose == (type juggling / magic hashes); use hash_equals()"
      - pattern: "[^=!<>]==\\s*(md5|sha1|hash|crc32|hash_hmac)\\s*\\("
        message: "Hash compared with loose == (type juggling / magic hashes); use hash_equals()"
      - pattern: "\\bstrcmp\\s*\\([^;]*\\)\\s*(==|!=)\\s*0"
        message: "strcmp() result loosely compared to 0 (array/NULL bypass)"
      - pattern: "\\$_(GET|POST|REQUEST|COOKIE)\\s*\\[[^\\]]+\\]\\s*(==|!=)\\s*[^=]"
        message: "Loose comparison directly on user input"
        severity: "low"
      - pattern: "\\bin_array\\s*\\(\\s*\\$_(GET|POST|REQUEST|COOKIE)[^;]*,[^,;()]*\\)\\s*\\)?\\s*[;)]"
        message: "in_array() on user input without strict=true"
        severity: "low"
    sanitizers: []
    remediation: "Use strict comparison (===). Use hash_equals() for hash/token comparison, in_array($x, $list, true)."

# --- Patterns de configuration dangereuse / exposition d'information ---
dangerous_configs:
  - pattern: "display_errors\\s*=\\s*(On|1|true)"
    severity: "medium"
    cwe: "CWE-209"
    message: "display_errors enabled - information exposure"
  - pattern: "ini_set\\s*\\(\\s*['\"]display_errors['\"]\\s*,\\s*['\"]?(1|On|on|true|stdout)"
    severity: "medium"
    cwe: "CWE-209"
    message: "display_errors enabled via ini_set() - information exposure"
  - pattern: "allow_url_include\\s*=\\s*(On|1|true)|ini_set\\s*\\(\\s*['\"]allow_url_include['\"]\\s*,\\s*['\"]?(1|On|on|true)"
    severity: "critical"
    cwe: "CWE-98"
    message: "allow_url_include enabled - remote file inclusion"
  - pattern: "allow_url_fopen\\s*=\\s*(On|1|true)"
    severity: "medium"
    cwe: "CWE-918"
    message: "allow_url_fopen enabled - SSRF risk"
  - pattern: "\\bphpinfo\\s*\\("
    severity: "medium"
    cwe: "CWE-200"
    message: "phpinfo() exposes server configuration"
  - pattern: "define\\s*\\(\\s*['\"]WP_DEBUG_DISPLAY['\"]\\s*,\\s*true"
    severity: "medium"
    cwe: "CWE-209"
    message: "WP_DEBUG_DISPLAY enabled - errors shown to visitors"
  - pattern: "define\\s*\\(\\s*['\"]WP_DEBUG['\"]\\s*,\\s*true"
    severity: "low"
    cwe: "CWE-489"
    message: "WP_DEBUG enabled - debug mode active"
  - pattern: "define\\s*\\(\\s*['\"]DISALLOW_FILE_EDIT['\"]\\s*,\\s*false"
    severity: "low"
    cwe: "CWE-16"
    message: "DISALLOW_FILE_EDIT disabled - theme/plugin editor available in admin"
  - pattern: "define\\s*\\(\\s*['\"]FORCE_SSL_ADMIN['\"]\\s*,\\s*false"
    severity: "low"
    cwe: "CWE-319"
    message: "FORCE_SSL_ADMIN disabled"
  - pattern: "\\bvar_dump\\s*\\(\\s*\\$_(GET|POST|REQUEST|SERVER|COOKIE|SESSION)"
    severity: "low"
    cwe: "CWE-209"
    message: "var_dump() of request/session data - debug output left in code"
  - pattern: "\\berror_reporting\\s*\\(\\s*E_ALL\\s*\\)\\s*;\\s*ini_set\\s*\\(\\s*['\"]display_errors['\"]\\s*,\\s*['\"]?1"
    severity: "medium"
    cwe: "CWE-209"
    message: "Verbose error display enabled"
  - pattern: "\\bsession\\.cookie_httponly\\s*=\\s*(0|Off|false)|ini_set\\s*\\(\\s*['\"]session\\.cookie_httponly['\"]\\s*,\\s*['\"]?(0|false|Off)"
    severity: "low"
    cwe: "CWE-1004"
    message: "Session cookie without HttpOnly"
  - pattern: "\\bsession\\.use_strict_mode\\s*=\\s*(0|Off|false)"
    severity: "low"
    cwe: "CWE-384"
    message: "session.use_strict_mode disabled (session fixation)"
